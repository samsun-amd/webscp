<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webscp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>webscp</h1>
    <span id="conn-status" class="status">ws: connecting…</span>
    <button id="manage-btn" title="Add, edit or remove saved machines">manage nodes</button>
    <button id="reload-btn" title="Re-read config.json">reload inventory</button>
  </header>

  <main>
    <section class="pane" id="pane-left" data-side="left">
      <div class="pane-head">
        <select class="endpoint-select"></select>
        <input class="path-input" type="text" placeholder="~" />
        <button class="go-btn">go</button>
        <button class="refresh-btn" title="Reload this pane">refresh</button>
        <button class="mkdir-btn" title="New folder">mkdir</button>
        <button class="adhoc-btn" title="Connect by typing credentials">ad-hoc</button>
      </div>
      <div class="breadcrumb"></div>
      <ul class="file-list"></ul>
      <div class="pane-msg"></div>
    </section>

    <section class="pane" id="pane-right" data-side="right">
      <div class="pane-head">
        <select class="endpoint-select"></select>
        <input class="path-input" type="text" placeholder="~" />
        <button class="go-btn">go</button>
        <button class="refresh-btn" title="Reload this pane">refresh</button>
        <button class="mkdir-btn" title="New folder">mkdir</button>
        <button class="adhoc-btn" title="Connect by typing credentials">ad-hoc</button>
      </div>
      <div class="breadcrumb"></div>
      <ul class="file-list"></ul>
      <div class="pane-msg"></div>
    </section>
  </main>

  <section id="queue">
    <div class="queue-head">
      <h2>Transfers</h2>
      <button id="clear-queue-btn" title="Remove finished transfers">clear</button>
    </div>
    <ul id="queue-list"></ul>
  </section>

  <!-- Modal host: populated by app.js (manage nodes / ad-hoc connect). -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
