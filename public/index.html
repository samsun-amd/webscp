<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webscp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>webscp</h1>
    <span id="conn-status" class="status">ws: connecting…</span>
    <button id="reload-btn" title="Re-read sshm_config groups">reload inventory</button>
  </header>
  <div id="inventory-status" role="status"></div>

  <main>
    <section class="pane" id="pane-left" data-side="left">
      <div class="pane-head">
        <select class="group-select" aria-label="Left group"></select>
        <select class="endpoint-select" aria-label="Left endpoint"></select>
        <button class="adhoc-btn" title="Connect by typing credentials">ad-hoc</button>
      </div>
      <div class="pane-head path-controls">
        <input class="path-input" type="text" placeholder="~" aria-label="Left path" />
        <button class="path-history-toggle" popovertarget="left-path-history" aria-label="Left recent paths" disabled>Recent paths ▾</button>
        <button class="go-btn">go</button>
        <button class="refresh-btn" title="Reload this pane">refresh</button>
        <button class="mkdir-btn" title="New folder">mkdir</button>
      </div>
      <ul id="left-path-history" class="path-history" popover="auto" aria-label="Left recent paths"></ul>
      <div class="breadcrumb"></div>
      <ul class="file-list"></ul>
      <div class="pane-msg"></div>
    </section>

    <section class="pane" id="pane-right" data-side="right">
      <div class="pane-head">
        <select class="group-select" aria-label="Right group"></select>
        <select class="endpoint-select" aria-label="Right endpoint"></select>
        <button class="adhoc-btn" title="Connect by typing credentials">ad-hoc</button>
      </div>
      <div class="pane-head path-controls">
        <input class="path-input" type="text" placeholder="~" aria-label="Right path" />
        <button class="path-history-toggle" popovertarget="right-path-history" aria-label="Right recent paths" disabled>Recent paths ▾</button>
        <button class="go-btn">go</button>
        <button class="refresh-btn" title="Reload this pane">refresh</button>
        <button class="mkdir-btn" title="New folder">mkdir</button>
      </div>
      <ul id="right-path-history" class="path-history" popover="auto" aria-label="Right recent paths"></ul>
      <div class="breadcrumb"></div>
      <ul class="file-list"></ul>
      <div class="pane-msg"></div>
    </section>
  </main>

  <section id="queue">
    <div class="queue-head">
      <h2>Transfers</h2>
      <button id="clear-queue-btn" title="Remove finished transfers">clear</button>
    </div>
    <ul id="queue-list"></ul>
  </section>

  <!-- Modal host: ad-hoc connections and transfer conflicts. -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
